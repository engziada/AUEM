# ============================================================
#  Pages CMS configuration — AUEM website
#  https://app.pagescms.org  →  repository: engziada/AUEM
#
#  This file decides WHAT the web admin can edit and WHERE the
#  values are stored. The site is rebuilt by GitHub Actions from
#  content/**/*.json after every save, so a change is live in
#  about one or two minutes.
#
#  Editing rules for developers:
#    * keep field names identical to the JSON keys in content/
#    * run `python tools/check_content.py` after changing anything
# ============================================================

# ---------- media (uploaded files) ----------
# Uploads are committed to the repository; build.py downscales them
# into dist/ (thumbnails included) without touching the originals.
media:
  - name: pages
    label: "صور الصفحات — Page images"
    input: assets/img/uploads/pages
    output: /assets/img/uploads/pages
    categories: [image]
    rename: random

  - name: news
    label: "صور الأخبار — News images"
    input: assets/img/uploads/news
    output: /assets/img/uploads/news
    categories: [image]
    rename: random

  - name: events
    label: "صور الفعاليات — Event images"
    input: assets/img/uploads/events
    output: /assets/img/uploads/events
    categories: [image]
    rename: random

  - name: gallery
    label: "صور المعرض — Gallery photos"
    input: assets/img/uploads/gallery
    output: /assets/img/uploads/gallery
    categories: [image]
    rename: random

# ---------- reusable bilingual fields ----------
components:
  # short single-line text
  text:
    type: object
    label: "عربي / English"
    fields:
      - name: ar
        label: "العربية"
        type: string
      - name: en
        label: "English"
        type: string

  # long text: one paragraph per line
  longtext:
    type: object
    label: "عربي / English"
    fields:
      - name: ar
        label: "العربية — فقرة واحدة في كل سطر"
        type: text
      - name: en
        label: "English — one paragraph per line"
        type: text

  # short label, safe to leave empty
  optional:
    type: object
    label: "عربي / English"
    fields:
      - name: ar
        label: "العربية"
        type: string
      - name: en
        label: "English"
        type: string

# ---------- editable content ----------
content:
  # ==========================================================
  #  1. Media & newsroom — the day-to-day work
  # ==========================================================
  - name: newsroom
    label: "الأخبار والفعاليات — Newsroom"
    type: group
    items:
      - name: news
        label: "الأخبار — News articles"
        type: collection
        path: content/news
        format: json
        exclude: ["README.md"]
        filename:
          template: "{year}-{month}-{day}-{hour}{minute}-{primary}.json"
          field: create
        view:
          fields: [date, title, published]
          primary: title
          sort: [date, title]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: "العنوان — Title"
            component: text
            required: true
          - name: date
            label: "تاريخ النشر — Publication date"
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: summary
            label: "ملخص قصير يظهر في الصفحة الرئيسية — Short summary (home page)"
            component: optional
          - name: body
            label: "نص الخبر — Full text"
            component: longtext
          - name: image
            label: "صورة الخبر — Article image"
            type: image
            options:
              media: news
              categories: [image]
          - name: source
            label: "المصدر — Source name"
            type: string
          - name: source_url
            label: "رابط المصدر — Source URL"
            type: string
          - name: published
            label: "منشور — Published"
            type: boolean
            default: true

      - name: events
        label: "الفعاليات — Events"
        type: collection
        path: content/events
        format: json
        exclude: ["README.md"]
        filename:
          template: "{year}-{month}-{day}-{hour}{minute}-{primary}.json"
          field: create
        view:
          fields: [start_date, title, published]
          primary: title
          sort: [start_date, title]
          default:
            sort: start_date
            order: desc
        fields:
          - name: title
            label: "اسم الفعالية — Event title"
            component: text
            required: true
          - name: start_date
            label: "تاريخ البداية — Start date"
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: end_date
            label: "تاريخ النهاية (اختياري) — End date (optional)"
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
          - name: location
            label: "المكان — Location"
            component: optional
          - name: summary
            label: "وصف مختصر — Short description"
            component: optional
          - name: body
            label: "تفاصيل الفعالية — Details"
            component: longtext
          - name: image
            label: "صورة الفعالية — Event image"
            type: image
            options:
              media: events
              categories: [image]
          - name: registration_url
            label: "رابط التسجيل — Registration URL"
            type: string
          - name: published
            label: "منشور — Published"
            type: boolean
            default: true

      - name: announcements
        label: "الإعلانات — Announcements"
        type: collection
        path: content/announcements
        format: json
        exclude: ["README.md"]
        filename:
          template: "{year}-{month}-{day}-{hour}{minute}.json"
          field: create
        view:
          fields: [date, title, active]
          primary: title
          sort: [date, title]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: "العنوان — Title"
            component: text
            required: true
          - name: body
            label: "نص الإعلان — Announcement text"
            component: optional
          - name: date
            label: "التاريخ — Date"
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: expires
            label: "ينتهي في (اختياري) — Expires on (optional)"
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
          - name: level
            label: "الأهمية — Importance"
            type: select
            default: info
            options:
              values:
                - name: info
                  label: "عادي — Normal"
                - name: important
                  label: "مهم — Important"
          - name: link_url
            label: "رابط الزر (اختياري) — Button URL (optional)"
            type: string
          - name: link_label
            label: "نص الزر — Button label"
            component: optional
          - name: active
            label: "مفعّل ويظهر في شريط الموقع — Active (show on the site)"
            type: boolean
            default: false

      - name: gallery
        label: "معرض الصور — Gallery photos"
        type: collection
        path: content/gallery
        format: json
        exclude: ["README.md"]
        filename:
          template: "{year}-{month}-{day}-{hour}{minute}.json"
          field: create
        view:
          fields: [date, image, caption]
          primary: caption
          sort: [date]
          default:
            sort: date
            order: desc
        fields:
          - name: image
            label: "الصورة — Photo"
            type: image
            required: true
            options:
              media: gallery
              categories: [image]
          - name: caption
            label: "التعليق — Caption"
            component: optional
          - name: date
            label: "التاريخ — Date"
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: published
            label: "منشور — Published"
            type: boolean
            default: true

